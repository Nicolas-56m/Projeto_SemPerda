<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SemPerdas</title>
    <link rel="stylesheet" href="../css/base.css">
</head>
<body class="login-page">
    <main class="login-container">
        <div class="logo">
            <img src="./assets/logo.png" alt="SemPerdas">
        </div>

        <h1>Tela de Login</h1>
        <p class="subtitulo">Entre com seu e-mail e senha para acessar o sistema.</p>

        <form id="formLogin" method="post">
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>

            <p id="mensagemErro" class="mensagem-erro" role="alert"></p>

            <button type="submit" class="botao-principal">Entrar no Sistema</button>
        </form>

        <p class="rodape">
            <a href="./erro.html">Esqueci minha senha</a>
        </p>

        <p class="rodape">
            <a href="./cadastro.html">Ainda não tenho conta</a>
        </p>

        <p class="rodape">SemPerdas · Sistema de Cadastro de Produtos</p>
    </main>

    <script src="../javascript/login.js"></script>
</body>
</html>
